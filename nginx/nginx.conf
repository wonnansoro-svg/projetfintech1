# Config nginx pour héberger le build de production COOPAVEC (dossier dist/)
# sur le réseau local, pour test terrain depuis les téléphones des testeurs.
#
# Utilisation (voir nginx/README.md pour le détail Windows) :
#   1. npm run build            (génère/actualise dist/)
#   2. nginx -c <chemin absolu vers ce fichier>
#   3. Sur les téléphones (même Wi-Fi) : http://<IP locale du PC>:8080

worker_processes  1;

events {
  worker_connections  1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout  65;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  server {
    listen       8080;
    server_name  _;

    # Chemin ABSOLU vers le dossier dist/ généré par `npm run build`.
    # Remplacer par le vrai chemin sur cette machine si différent.
    root   "d:/PROJET_Dev_Front_end/projetfintech1/dist";
    index  index.html;

    # SPA : toute route inconnue retombe sur index.html (état géré côté client).
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Assets fingerprintés (JS/CSS/images) : cache long, ils changent de nom à chaque build.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
      add_header Cache-Control "no-cache";
    }
  }
}
